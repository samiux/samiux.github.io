<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>间歇性断食追踪器</title>
<style>
  :root{
    --accent:#0d9488; --accent2:#6366f1; --danger:#e11d48;
    --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0; --muted:#64748b;
    --ink:#0f172a;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:10px 16px;background:#0f172a;color:#fff;
    position:sticky;top:0;z-index:50;
  }
  .brand{font-weight:700;font-size:17px;letter-spacing:.5px}
  .spacer{flex:1}
  .userbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .userbar select,.userbar input{
    padding:7px 10px;border-radius:9px;border:1px solid #334155;
    background:#1e293b;color:#fff;font-size:13px;outline:none;
  }
  .userbar input{width:130px}
  .userbar button{
    padding:7px 12px;border-radius:9px;border:none;cursor:pointer;
    background:var(--accent);color:#fff;font-size:13px;font-weight:600;
  }
  .db-indicator{
    font-size:12px;padding:5px 10px;border-radius:9px;
    background:#1e293b;color:#cbd5e1;display:inline-flex;align-items:center;gap:6px;
    cursor:pointer;border:1px solid #334155;
  }
  .db-indicator.linked{background:#064e3b;color:#6ee7b7;border-color:#065f46}
  .db-indicator .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
  .db-indicator.linked .dot{background:#34d399}
  .db-indicator.dirty .dot{background:#fbbf24}
  .db-indicator.error{background:#7f1d1d;color:#fecaca;border-color:#991b1b}
  .db-indicator.error .dot{background:#ef4444}
  .db-indicator.permission{background:#78350f;color:#fde68a;border-color:#92400e}
  .db-indicator.permission .dot{background:#f59e0b}
  .permission-banner{
    background:#fef3c7;color:#78350f;border-bottom:1px solid #fde68a;
    padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;
  }
  .permission-banner b{color:#92400e}
  .permission-banner .btn{background:#fff}
  .tabs{
    display:flex;gap:6px;padding:10px 16px;overflow-x:auto;
    background:#0f172a;position:sticky;top:53px;z-index:49;
  }
  .tab{
    padding:8px 16px;border-radius:10px;border:none;cursor:pointer;
    background:#1e293b;color:#cbd5e1;font-size:14px;white-space:nowrap;
    transition:.15s;
  }
  .tab.active{background:var(--accent);color:#fff;font-weight:600}
  main{max-width:1080px;margin:0 auto;padding:16px 16px 60px}
  .card{
    background:var(--card);border-radius:16px;padding:16px 18px;
    box-shadow:0 1px 3px rgba(15,23,42,.07);margin-bottom:16px;
  }
  .card h2{margin:0 0 12px;font-size:18px}
  .card h3{margin:0 0 10px;font-size:15px;color:#334155}
  .muted{color:var(--muted);font-size:13px}
  .empty{text-align:center;padding:38px 16px;color:var(--muted)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:#475569;margin-bottom:5px;font-weight:600}
  input[type=text],input[type=number],input[type=search],input[type=date],input[type=time],
  input[type=datetime-local],select,textarea{
    width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--border);
    background:#fff;font-size:14px;font-family:inherit;color:var(--ink);outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
  textarea{resize:vertical}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-grid .full{grid-column:1/-1}
  @media(max-width:640px){.form-grid{grid-template-columns:1fr}}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btn{
    padding:9px 15px;border-radius:10px;border:1px solid var(--border);background:#fff;
    cursor:pointer;font-size:14px;font-family:inherit;color:var(--ink);
    transition:.15s;display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{background:#f8fafc}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn.primary:hover{background:#0f766e}
  .btn.danger{color:var(--danger);border-color:#fecdd3}
  .btn.danger:hover{background:#fff1f2}
  .btn.small{padding:6px 12px;font-size:13px}
  .plan-chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;
    cursor:pointer;font-size:13px;font-family:inherit;color:#334155;transition:.15s;
  }
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .hint{font-size:13px;color:var(--muted);margin:8px 0 12px}
  .hint b{color:var(--accent)}
  .timer-card{text-align:center}
  .timer-head{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .badge{
    display:inline-block;padding:4px 12px;border-radius:999px;
    background:#ccfbf1;color:#0f766e;font-size:13px;font-weight:700;
  }
  .pill{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.ongoing{background:#dbeafe;color:#1d4ed8}
  .pill.completed{background:#dcfce7;color:#15803d}
  .pill.early{background:#fee2e2;color:#b91c1c}
  .pill.extended{background:#fef3c7;color:#b45309}
  .big-clock{
    font-size:clamp(38px,10vw,64px);font-weight:800;letter-spacing:2px;
    font-variant-numeric:tabular-nums;color:var(--ink);margin:6px 0 10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .progress{height:14px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin:0 auto 6px;max-width:640px}
  .progress-bar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#14b8a6,#0ea5e9);transition:width .6s ease}
  .progress-bar.over{background:linear-gradient(90deg,#22c55e,#84cc16)}
  .timer-meta{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;margin:16px 0;text-align:left;
  }
  .timer-meta div{background:#f8fafc;border-radius:12px;padding:10px 12px}
  .timer-meta span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .timer-meta b{font-size:14px;font-variant-numeric:tabular-nums}
  .timer-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toolbar input[type=search]{flex:1;min-width:180px}
  .toolbar select{width:auto;min-width:120px}
  .rec-card{
    background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(15,23,42,.07);border-left:4px solid var(--accent);
  }
  .rec-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .rec-dur{font-weight:800;color:var(--accent);margin-left:auto;font-variant-numeric:tabular-nums}
  .rec-time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .rec-text{margin-top:8px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .rec-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .rec-imgs img{width:74px;height:74px;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--border)}
  .rec-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .rec-actions button{
    padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;
    cursor:pointer;font-size:13px;font-family:inherit;
  }
  .rec-actions button:hover{background:#f8fafc}
  .rec-actions .del{color:var(--danger);border-color:#fecdd3}
  .entries{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .entry{
    background:#f8fafc;border-radius:12px;padding:10px 12px;border:1px solid var(--border);
    font-size:13.5px;
  }
  .entry-head{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;
    color:#334155;font-weight:600;
  }
  .entry-head .tag{
    background:#e0f2fe;color:#0369a1;border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:700;
  }
  .entry-metrics{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .entry-metrics span{background:#fff;border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:12px}
  .entry-text{margin-top:6px;white-space:pre-wrap;word-break:break-word;color:#1e293b}
  .entry-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .entry-imgs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head h2{margin:0}
  .cal-nav{display:flex;gap:8px;align-items:center}
  .cal-nav button{
    width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
    background:#fff;cursor:pointer;font-size:16px;
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
  .cal-cell{
    min-height:64px;border-radius:10px;background:#f8fafc;padding:6px;
    display:flex;flex-direction:column;gap:3px;cursor:pointer;
    border:1px solid transparent;transition:.15s;
  }
  .cal-cell:hover{background:#eef2f7}
  .cal-cell.other{background:transparent;cursor:default;color:#cbd5e1}
  .cal-cell.today{border-color:var(--accent)}
  .cal-cell.sel{background:#ccfbf1;border-color:var(--accent)}
  .cal-cell.has{background:#e0f2fe}
  .cal-day{font-size:13px;font-weight:700}
  .cal-badge{font-size:10.5px;color:#0369a1;background:#bae6fd;border-radius:6px;padding:2px 4px;align-self:flex-start}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
  .stat{
    background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.07);
    text-align:center;
  }
  .stat .v{font-size:22px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .stat .l{font-size:12px;color:var(--muted);margin-top:4px}
  canvas.chart{width:100%;height:220px;display:block}
  .modal-root{
    position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .modal{
    background:#fff;border-radius:18px;width:100%;max-width:780px;max-height:92vh;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
  .modal-head h3{margin:0;font-size:17px}
  .modal-head button{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);padding:0 4px}
  .modal-body{padding:16px 18px;overflow-y:auto;flex:1}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border);background:#f8fafc}
  .image-list{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .image-item{position:relative;width:96px}
  .image-item img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--border);display:block}
  .image-item select{font-size:11px;padding:3px 4px;margin-top:4px;border-radius:6px}
  .image-item .rm{
    position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
    background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:13px;line-height:1;
  }
  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;
    display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;
  }
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px}
  textarea#jsonView{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;background:#0f172a;color:#a5f3fc}
  .day-detail{margin-top:16px}
  .status-box{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;border-radius:12px;background:#f8fafc;
    border:1px solid var(--border);font-size:13.5px;margin-top:12px;
  }
  .status-box.ok{background:#ecfdf5;border-color:#a7f3d0}
  .status-box.warn{background:#fffbeb;border-color:#fde68a}
  .status-box.error{background:#fef2f2;border-color:#fecaca}
  .dt24{ display:flex;gap:6px;align-items:center; }
  .dt24 input[type=date]{flex:0 0 auto;width:150px}
  .dt24 input[type=time]{flex:0 0 auto;width:110px}
  .dt24 .sep{color:var(--muted);font-size:13px}
  .entry-editor{
    background:#f8fafc;border:1px solid var(--border);border-radius:14px;
    padding:14px;margin-bottom:12px;
  }
  .entry-editor h4{
    margin:0 0 10px;font-size:14px;color:#334155;display:flex;align-items:center;gap:8px;
  }
  .entry-editor h4 .tag{
    background:#ccfbf1;color:#0f766e;border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:700;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">⏱ 间歇性断食追踪器</div>
  <div class="db-indicator" id="dbIndicator" data-action="open-db-tab" title="点击前往数据管理">
    <span class="dot"></span><span id="dbIndicatorText">未连接硬盘</span>
  </div>
  <div class="spacer"></div>
  <div class="userbar">
    <select id="userSelect" title="选择使用者"></select>
    <input id="nickInput" placeholder="输入 nickname" maxlength="24">
    <button data-action="switch-user">切换 / 建立</button>
  </div>
</header>

<div class="permission-banner" id="permissionBanner" hidden>
  <span>⚠ 已找到上次连接的本地文件夹，但需要一次点击恢复写入权限：</span>
  <b id="permissionFileName">—</b>
  <button class="btn small primary" data-action="restore-permission">🔑 恢复写入权限</button>
  <button class="btn small" data-action="forget-handle">忘记该文件夹</button>
</div>

<nav class="tabs">
  <button class="tab active" data-tab="timer">⏳ 断食</button>
  <button class="tab" data-tab="records">📋 记录</button>
  <button class="tab" data-tab="calendar">📅 日历</button>
  <button class="tab" data-tab="stats">📊 统计</button>
  <button class="tab" data-tab="data">💾 数据</button>
</nav>

<main>
  <section id="tab-timer" class="pane"></section>
  <section id="tab-records" class="pane" hidden></section>
  <section id="tab-calendar" class="pane" hidden></section>
  <section id="tab-stats" class="pane" hidden></section>
  <section id="tab-data" class="pane" hidden></section>
</main>

<div id="modalRoot" class="modal-root" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">记录</h3>
      <button data-action="close-modal">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn danger" data-action="delete-current" id="modalDelete" hidden>删除</button>
      <button class="btn" data-action="close-modal">取消</button>
      <button class="btn primary" data-action="save-record">保存</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   常量
   ========================================================= */
const LS_KEY = 'if_tracker_v1';
const DB_FILENAME = 'fasting-data.json';
const IDB_NAME = 'if_tracker_handles';
const IDB_STORE = 'handles';
const IDB_KEY = 'db_dir';

const PLANS = [
  {key:'12:12', label:'12:12', hours:12},
  {key:'16:8',  label:'16:8',  hours:16},
  {key:'20:4',  label:'20:4',  hours:20},
  {key:'22:2',  label:'22:2',  hours:22},
  {key:'23:1',  label:'23:1',  hours:23},
  {key:'24h',   label:'24 小时', hours:24},
  {key:'36h',   label:'36 小时', hours:36},
  {key:'48h',   label:'48 小时', hours:48},
  {key:'52h',   label:'52 小时', hours:52},
  {key:'58h',   label:'58 小时', hours:58},
  {key:'72h',   label:'72 小时', hours:72},
  {key:'custom',label:'自定义', hours:null}
];
const PLAN_MAP = Object.fromEntries(PLANS.map(p => [p.key, p]));
const IMG_CATS = ['丙酮','血糖','运动','其他'];

/* =========================================================
   工具
   ========================================================= */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtDateTime(ts){
  if(ts == null) return '—';
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtTime(ts){ const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(ts){ const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtMD(ts){ const d = new Date(ts); return `${pad(d.getMonth()+1)}/${pad(d.getDate())}`; }

function toDateValue(ts){ const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function toTimeValue(ts){ const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function combineDateTime(dateStr, timeStr){
  if(!dateStr || !timeStr) return null;
  const t = new Date(`${dateStr}T${timeStr}`).getTime();
  return isNaN(t) ? null : t;
}
function fromLocalInput(v){
  if(!v) return null;
  const t = new Date(v).getTime();
  return isNaN(t) ? null : t;
}
function fmtDuration(ms){
  if(ms == null || isNaN(ms)) return '—';
  const neg = ms < 0; ms = Math.abs(ms);
  const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
  const str = h > 0 ? `${h} 小时 ${pad(m)} 分` : `${m} 分 ${pad(s)} 秒`;
  return (neg?'-':'') + str;
}
function fmtDurShort(ms){
  const h = ms/3600000;
  if(h < 1) return Math.round(ms/60000) + ' 分';
  return (Math.round(h*10)/10) + ' 小时';
}
function weekStart(ts){
  const d = new Date(ts); d.setHours(0,0,0,0);
  const dow = (d.getDay()+6)%7;
  d.setDate(d.getDate()-dow);
  return d.getTime();
}

/* =========================================================
   状态
   ========================================================= */
function defaultData(){ return { version:1, currentUser:null, users:{} }; }

/* =========================================================
   IndexedDB 安全包装（绝不抛出到调用者）
   ========================================================= */
const idb = {
  available: (() => { try { return typeof indexedDB !== 'undefined' && indexedDB !== null; } catch(_) { return false; } })(),
  _open(){
    return new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          try {
            const d = req.result;
            if(!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE);
          } catch(_) {}
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('IDB open error'));
      } catch(err){ reject(err); }
    });
  },
  async set(key, value){
    if(!this.available) return false;
    try {
      const conn = await this._open();
      return await new Promise((resolve) => {
        try {
          const tx = conn.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(value, key);
          tx.oncomplete = () => { try { conn.close(); } catch(_){} resolve(true); };
          tx.onerror = () => { try { conn.close(); } catch(_){} resolve(false); };
        } catch(_) { try { conn.close(); } catch(_){} resolve(false); }
      });
    } catch(_) { return false; }
  },
  async get(key){
    if(!this.available) return null;
    try {
      const conn = await this._open();
      return await new Promise((resolve) => {
        try {
          const tx = conn.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => { try { conn.close(); } catch(_){} resolve(req.result || null); };
          req.onerror = () => { try { conn.close(); } catch(_){} resolve(null); };
        } catch(_) { try { conn.close(); } catch(_){} resolve(null); }
      });
    } catch(_) { return null; }
  },
  async del(key){
    if(!this.available) return false;
    try {
      const conn = await this._open();
      return await new Promise((resolve) => {
        try {
          const tx = conn.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).delete(key);
          tx.oncomplete = () => { try { conn.close(); } catch(_){} resolve(true); };
          tx.onerror = () => { try { conn.close(); } catch(_){} resolve(false); };
        } catch(_) { try { conn.close(); } catch(_){} resolve(false); }
      });
    } catch(_) { return false; }
  }
};

/* =========================================================
   本地硬盘 JSON 数据库
   ========================================================= */
const db = {
  fileHandle: null,
  dirHandle: null,
  supported: (() => { try { return typeof window.showDirectoryPicker === 'function'; } catch(_){ return false; } })(),
  dirty: false,
  lastError: null,
  writeLock: null,
  writePending: false,
  needsPermission: false,
  pendingDirName: ''
};

function resetDbHandle(clearPersist){
  db.fileHandle = null;
  db.dirHandle = null;
  db.needsPermission = false;
  db.pendingDirName = '';
  if(clearPersist) idb.del(IDB_KEY).catch(()=>{});
  updateDbIndicator();
}

async function chooseDatabaseFolder(){
  if(!db.supported){
    alert('你的浏览器不支持直接写入本地文件夹。\n\n建议：\n• 使用 Chrome / Edge\n• 或改用「导出 / 导入 JSON」手动管理数据');
    return false;
  }
  try{
    const dir = await window.showDirectoryPicker({ mode:'readwrite' });
    db.dirHandle = dir;
    db.fileHandle = await dir.getFileHandle(DB_FILENAME, { create:true });

    idb.set(IDB_KEY, { dir: db.dirHandle, file: db.fileHandle, savedAt: Date.now() }).catch(()=>{});

    const file = await db.fileHandle.getFile();
    if(file.size > 0){
      const text = await file.text();
      if(text.trim()){
        try{
          const parsed = JSON.parse(text);
          if(parsed && typeof parsed.users === 'object'){
            const useExisting = confirm(
              `文件夹中已存在 ${DB_FILENAME}（${Math.round(file.size/1024)} KB）。\n\n` +
              `按「确定」= 载入硬盘上的数据（覆盖目前画面内容）\n` +
              `按「取消」= 保留目前数据并写回硬盘（覆盖硬盘文件）`
            );
            if(useExisting){
              state.data = parsed;
              if(!state.data.users) state.data.users = {};
              migrateData();
              $('#tab-records').dataset.built = '';
            }
          }
        }catch(err){
          if(!confirm('硬盘上的 JSON 格式无法解析。要改用目前数据覆盖它吗？')) return false;
        }
      }
    }

    db.lastError = null;
    db.needsPermission = false;
    const ok = await writeDatabase({ silent:true });
    renderAll();
    if(ok){
      alert(`✅ 已连接本地数据库：\n${db.dirHandle.name}/${DB_FILENAME}\n\n之后所有变更都会自动写回此文件，下次打开会自动恢复连接。`);
    }else{
      alert(`⚠ 已选择文件夹，但写入测试失败：${db.lastError || '未知错误'}\n\n请确认文件夹权限，或尝试重新连接。`);
    }
    return ok;
  }catch(err){
    if(err && err.name === 'AbortError') return false;
    console.error(err);
    db.lastError = err ? err.message : '未知错误';
    alert('选择文件夹失败：' + (err ? err.message : err));
    return false;
  }
}

async function restoreHandleOnStartup(){
  if(!db.supported) return;
  try{
    const saved = await idb.get(IDB_KEY);
    if(!saved || !saved.dir) return;

    const dir = saved.dir;
    const file = saved.file;
    let perm = 'prompt';
    try{
      perm = await dir.queryPermission({ mode:'readwrite' });
    }catch(_){ perm = 'prompt'; }

    if(perm === 'granted'){
      db.dirHandle = dir;
      db.fileHandle = file;
      db.needsPermission = false;
      db.pendingDirName = dir.name;
      try{
        const f = await file.getFile();
        if(f.size > 0){
          const parsed = JSON.parse(await f.text());
          if(parsed && parsed.users){
            state.data = parsed;
            migrateData();
            $('#tab-records').dataset.built = '';
          }
        }
      }catch(err){ console.warn('读取磁盘文件失败', err); }
      updateDbIndicator();
      renderAll();
      return;
    }

    db.dirHandle = dir;
    db.fileHandle = file;
    db.needsPermission = true;
    db.pendingDirName = dir.name;
    updateDbIndicator();
    renderAll();
  }catch(err){
    console.warn('恢复 handle 失败', err);
  }
}

async function restorePermission(){
  if(!db.dirHandle){
    return chooseDatabaseFolder();
  }
  try{
    let perm = 'prompt';
    try{ perm = await db.dirHandle.queryPermission({ mode:'readwrite' }); }catch(_){ perm = 'prompt'; }
    if(perm !== 'granted'){
      perm = await db.dirHandle.requestPermission({ mode:'readwrite' });
    }
    if(perm !== 'granted'){
      alert('未获得写入权限，无法自动写入硬盘文件。');
      return false;
    }
    if(!db.fileHandle){
      db.fileHandle = await db.dirHandle.getFileHandle(DB_FILENAME, { create:true });
      idb.set(IDB_KEY, { dir: db.dirHandle, file: db.fileHandle, savedAt: Date.now() }).catch(()=>{});
    }
    db.needsPermission = false;
    db.lastError = null;

    try{
      const f = await db.fileHandle.getFile();
      if(f.size > 0){
        const parsed = JSON.parse(await f.text());
        if(parsed && parsed.users){
          const useDisk = confirm('已获得权限。是否用磁盘上的 JSON 覆盖当前数据？\n按「取消」会保留当前数据并写回磁盘。');
          if(useDisk){
            state.data = parsed;
            migrateData();
            $('#tab-records').dataset.built = '';
          }
        }
      }
    }catch(err){ console.warn('读取磁盘失败', err); }

    await writeDatabase({ silent:true });
    updateDbIndicator();
    renderAll();
    return true;
  }catch(err){
    console.error(err);
    alert('恢复权限失败：' + (err ? err.message : err));
    db.needsPermission = true;
    updateDbIndicator();
    return false;
  }
}

async function forgetHandle(){
  if(!confirm('确定要忘记上次记住的文件夹吗？\n之后需要重新「连接 / 选择文件夹」。')) return;
  await idb.del(IDB_KEY);
  resetDbHandle(false);
  renderAll();
}

function queueWrite(task){
  const prev = db.writeLock || Promise.resolve();
  db.writeLock = prev.then(task, task);
  return db.writeLock;
}

async function writeDatabase(opts){
  opts = opts || {};
  const silent = !!opts.silent;
  const retry = (opts.retry == null) ? 1 : opts.retry;

  if(!db.fileHandle){
    db.dirty = true;
    updateDbIndicator();
    return false;
  }
  if(db.needsPermission){
    db.dirty = true;
    updateDbIndicator();
    if(!silent) alert('需要先在顶部恢复写入权限，才能写入硬盘。');
    return false;
  }
  db.writePending = true;
  updateDbIndicator();

  return queueWrite(async () => {
    let lastErr = null;
    for(let attempt = 0; attempt <= retry; attempt++){
      let writable = null;
      try{
        writable = await db.fileHandle.createWritable();
        await writable.write(JSON.stringify(state.data, null, 2));
        await writable.close();
        writable = null;
        db.dirty = false;
        db.lastError = null;
        db.writePending = false;
        updateDbIndicator();
        return true;
      }catch(err){
        lastErr = err;
        if(writable){
          try{ await writable.abort(); }catch(_){}
          try{ await writable.close(); }catch(_){}
        }
        console.error(`写入失败（第 ${attempt+1} 次）`, err);
        if(err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) break;
        if(attempt < retry) await new Promise(r => setTimeout(r, 200));
      }
    }

    db.dirty = true;
    db.writePending = false;
    db.lastError = lastErr ? lastErr.message : '未知错误';

    const isPermission = lastErr && (lastErr.name === 'NotAllowedError' || lastErr.name === 'SecurityError');
    if(isPermission){
      db.needsPermission = true;
      db.fileHandle = null;
      db.pendingDirName = db.dirHandle ? db.dirHandle.name : '';
    }
    updateDbIndicator();

    if(!silent){
      alert(
        '写入本地文件失败：' + (lastErr ? lastErr.message : '未知错误') +
        (isPermission
          ? '\n\n权限已失效。请在页面顶部点击「恢复写入权限」，或到「💾 数据」页重新连接。'
          : '\n\n数据仍保存在浏览器 localStorage 中，可稍后重试。')
      );
    }
    return false;
  });
}

async function reloadFromDisk(){
  if(!db.fileHandle){
    if(db.dirHandle && db.needsPermission){
      alert('尚未恢复写入权限，请先在顶部点击「恢复写入权限」。');
    }else{
      alert('尚未连接本地数据库，请先选择文件夹。');
    }
    return;
  }
  try{
    const file = await db.fileHandle.getFile();
    if(!file.size){ alert('文件是空的，没有可载入的数据。'); return; }
    const parsed = JSON.parse(await file.text());
    if(!parsed || typeof parsed.users !== 'object'){ alert('文件格式不正确（缺少 users）。'); return; }
    if(!confirm('确定用硬盘上的 JSON 覆盖目前内存中的数据吗？')) return;
    state.data = parsed;
    if(!state.data.users) state.data.users = {};
    migrateData();
    $('#tab-records').dataset.built = '';
    renderAll();
    alert('✅ 已从硬盘重新载入。');
  }catch(err){
    alert('读取失败：' + (err ? err.message : err));
  }
}

function unlinkDatabase(){
  if(!db.fileHandle && !db.needsPermission && !db.dirHandle) return;
  if(!confirm('解除连接后，数据不会再自动写入本地文件（只留在浏览器中）。\n「记住的文件夹」也会被清除，之后需要重新选择。确定吗？')) return;
  resetDbHandle(true);
  renderAll();
}

function updateDbIndicator(){
  try{
    const el = $('#dbIndicator');
    const txt = $('#dbIndicatorText');
    if(!el || !txt) return;

    const banner = $('#permissionBanner');
    const bannerName = $('#permissionFileName');

    const linked = !!db.fileHandle && !db.needsPermission;
    const hasError = !!db.lastError && linked;
    const needsPerm = !!db.needsPermission;

    el.classList.toggle('linked', linked && !hasError);
    el.classList.toggle('dirty', linked && db.dirty && !hasError);
    el.classList.toggle('error', hasError);
    el.classList.toggle('permission', needsPerm);

    if(needsPerm){
      txt.textContent = '权限待恢复：' + (db.pendingDirName || (db.dirHandle ? db.dirHandle.name : ''));
      if(banner){
        banner.hidden = false;
        if(bannerName) bannerName.textContent = db.pendingDirName || (db.dirHandle ? db.dirHandle.name : '') || '—';
      }
    }else{
      if(banner) banner.hidden = true;
      if(linked){
        if(hasError) txt.textContent = '写入出错，请重连';
        else if(db.writePending) txt.textContent = '硬盘：' + (db.dirHandle ? db.dirHandle.name : '') + '/' + DB_FILENAME + '（写入中…）';
        else txt.textContent = '硬盘：' + (db.dirHandle ? db.dirHandle.name : '') + '/' + DB_FILENAME + (db.dirty ? '（未写入）' : '');
      }else if(db.lastError){
        txt.textContent = '连接已断开，请重连';
      }else if(db.supported){
        txt.textContent = '未连接硬盘';
      }else{
        txt.textContent = '浏览器不支持硬盘写入';
      }
    }
  }catch(err){ console.warn('updateDbIndicator 出错', err); }
}

async function retryWrite(){
  if(db.needsPermission) return restorePermission();
  if(!db.fileHandle){ alert('尚未连接本地数据库，请先选择文件夹。'); return; }
  const ok = await writeDatabase();
  if(ok) alert('✅ 写入成功。');
  renderAll();
}

/* =========================================================
   旧数据迁移
   ========================================================= */
function migrateData(){
  if(!state.data || !state.data.users) return;
  let changed = false;
  try {
    for(const u of Object.values(state.data.users)){
      (u.records || []).forEach(r => {
        if(r.ketone != null && r.acetone == null){ r.acetone = r.ketone; changed = true; }
        if('ketone' in r){ delete r.ketone; changed = true; }

        if(!Array.isArray(r.entries)){
          const hasData = (r.acetone != null && r.acetone !== '') ||
                          (r.glucose != null && r.glucose !== '') ||
                          (r.exercise && r.exercise.trim()) ||
                          (r.feeling && r.feeling.trim()) ||
                          (r.note && r.note.trim()) ||
                          (Array.isArray(r.images) && r.images.length);
          r.entries = hasData ? [{
            id: uid(), timestamp: r.startAt,
            dateTime: r.recordDateTime || fmtDateTime(r.startAt),
            acetone: r.acetone != null ? r.acetone : null,
            glucose: r.glucose != null ? r.glucose : null,
            exercise: r.exercise || '', feeling: r.feeling || '', note: r.note || '',
            images: Array.isArray(r.images) ? r.images : []
          }] : [];
          changed = true;
        } else {
          r.entries.forEach(e => {
            if(!e.id){ e.id = uid(); changed = true; }
            if(e.timestamp == null && e.dateTime){
              const t = new Date(String(e.dateTime).replace(' ', 'T')).getTime();
              if(!isNaN(t)){ e.timestamp = t; changed = true; }
            }
            if(!e.dateTime && e.timestamp){ e.dateTime = fmtDateTime(e.timestamp); changed = true; }
          });
        }
        ['acetone','glucose','exercise','feeling','note'].forEach(k => {
          if(k in r){ delete r[k]; changed = true; }
        });
        if('images' in r && Array.isArray(r.entries)){ delete r.images; changed = true; }

        if(r.originalTargetEndAt == null){
          if(r.targetHours != null && r.startAt != null) r.originalTargetEndAt = r.startAt + r.targetHours*3600000;
          else if(r.targetEndAt != null) r.originalTargetEndAt = r.targetEndAt;
          else r.originalTargetEndAt = r.startAt;
          changed = true;
        }
        if(r.originalTargetHours == null && r.originalTargetEndAt != null && r.startAt != null){
          r.originalTargetHours = (r.originalTargetEndAt - r.startAt) / 3600000;
          changed = true;
        }
        if(!r.recordDateTime){ r.recordDateTime = fmtDateTime(r.createdAt || r.startAt); changed = true; }
        if(!r.recordDate){ r.recordDate = fmtDate(r.createdAt || r.startAt); changed = true; }
      });
    }
  } catch(err){ console.warn('迁移出错', err); }
  if(changed) console.log('数据已迁移');
}

/* =========================================================
   数据存取
   ========================================================= */
function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && typeof d === 'object' && d.users) return d;
    }
  }catch(e){ console.warn('localStorage 读取失败', e); }
  return defaultData();
}

function saveData(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state.data)); }
  catch(e){ console.warn('localStorage 写入失败', e); }
  if(db.fileHandle && !db.needsPermission){
    writeDatabase({ silent:false });
  }else{
    db.dirty = true;
    updateDbIndicator();
  }
  return true;
}

function currentUser(){
  const n = state.data.currentUser;
  return n ? (state.data.users[n] || null) : null;
}

function recordStatus(r, now){
  now = now || Date.now();
  if(!r.actualEndAt) return 'ongoing';
  const orig = (r.originalTargetEndAt != null) ? r.originalTargetEndAt : r.targetEndAt;
  const dur = r.actualEndAt - r.startAt;
  const origDur = orig - r.startAt;
  return dur >= origDur ? 'completed' : 'early';
}
function statusText(s){
  return { ongoing:'进行中', completed:'已达标', early:'提前结束' }[s] || s;
}
function recordDuration(r, now){
  now = now || Date.now();
  return (r.actualEndAt != null ? r.actualEndAt : now) - r.startAt;
}
function recordOriginalTargetMs(r){
  if(r.originalTargetEndAt != null) return r.originalTargetEndAt - r.startAt;
  if(r.originalTargetHours != null) return r.originalTargetHours*3600000;
  return r.targetEndAt - r.startAt;
}
function recordCurrentTargetMs(r){ return r.targetEndAt - r.startAt; }
function recordWasExtended(r){
  const orig = (r.originalTargetEndAt != null) ? r.originalTargetEndAt : r.targetEndAt;
  return r.targetEndAt > orig + 1000;
}
function collectMeasurements(user){
  const out = [];
  (user.records || []).forEach(r => {
    (r.entries || []).forEach(e => { out.push({ rec: r, entry: e, ts: (e.timestamp != null) ? e.timestamp : r.startAt }); });
  });
  return out;
}

function updateTimerLive(){
  try{
    const user = currentUser();
    if(!user) return;
    const r = user.records.find(x => !x.actualEndAt);
    if(!r) return;
    const clock = $('#timerClock');
    if(!clock) return;

    const now = Date.now();
    const elapsed = now - r.startAt;
    const target = Math.max(1, r.targetEndAt - r.startAt);
    const h = Math.floor(elapsed/3600000), m = Math.floor(elapsed%3600000/60000), s = Math.floor(elapsed%60000/1000);
    clock.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);

    const pct = elapsed / target * 100;
    const bar = $('#timerProgress');
    if(bar){
      bar.style.width = Math.min(100, pct) + '%';
      bar.classList.toggle('over', pct >= 100);
    }
    const pctEl = $('#timerPct');
    if(pctEl) pctEl.textContent = '当前目标完成度 ' + pct.toFixed(1) + '%' + (pct >= 100 ? ' 🎉 已达成目标！' : '');

    const elapsedEl = $('#timerElapsed');
    if(elapsedEl) elapsedEl.textContent = fmtDuration(elapsed);
    const remEl = $('#timerRemain');
    if(remEl){
      const rem = r.targetEndAt - now;
      remEl.textContent = rem > 0 ? fmtDuration(rem) : ('已超过目标 ' + fmtDuration(-rem));
    }
    const targetEndEl = $('#timerTargetEnd');
    if(targetEndEl) targetEndEl.textContent = fmtDateTime(r.targetEndAt);

    const stEl = $('#timerStatus');
    if(stEl){
      const st = recordStatus(r, now);
      stEl.className = 'pill ' + st;
      stEl.textContent = statusText(st);
    }
  }catch(err){ console.warn('updateTimerLive 出错', err); }
}

function renderRecordList(){
  const el = $('#recordsList');
  if(!el) return;
  const user = currentUser();
  if(!user){ el.innerHTML = ''; return; }
  const f = state.recordFilter;
  const now = Date.now();
  let list = user.records.slice();
  const q = f.q.trim().toLowerCase();
  if(q){
    list = list.filter(r => {
      const entryHay = (r.entries || []).map(e => [e.acetone, e.glucose, e.exercise, e.feeling, e.note, e.dateTime].join(' ')).join(' ');
      const hay = [r.plan, fmtDate(r.startAt), fmtDateTime(r.startAt), entryHay].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(f.status !== 'all') list = list.filter(r => recordStatus(r, now) === f.status);
  list.sort((a,b) => f.sort === 'desc' ? b.startAt - a.startAt : a.startAt - b.startAt);
  if(!list.length){
    el.innerHTML = '<div class="card empty">没有符合条件的记录。</div>';
    return;
  }
  el.innerHTML = list.map(r => recordCardHTML(r, now)).join('');
}

function recordCardHTML(r, now){
  const st = recordStatus(r, now);
  const dur = recordDuration(r, now);
  const origTarget = recordOriginalTargetMs(r);
  const curTarget = recordCurrentTargetMs(r);
  const extended = recordWasExtended(r);
  const entries = (r.entries || []).slice().sort((a,b) => (a.timestamp||0) - (b.timestamp||0));
  const entriesHTML = entries.length
    ? '<div class="entries">' + entries.map(e => entryViewHTML(e)).join('') + '</div>'
    : '<p class="muted" style="margin-top:8px">尚无测量 / 感受子记录。</p>';
  const targetLine = extended
    ? '原始目标 ' + fmtDurShort(origTarget) + ' → 延长至 ' + fmtDurShort(curTarget)
    : '目标 ' + fmtDurShort(origTarget);

  return '<div class="rec-card">' +
    '<div class="rec-top">' +
      '<span class="badge">' + esc(r.plan) + '</span>' +
      '<span class="pill ' + st + '">' + statusText(st) + '</span>' +
      (extended ? '<span class="pill extended">已延长</span>' : '') +
      '<span class="rec-dur">' + fmtDuration(dur) + '</span>' +
    '</div>' +
    '<div class="rec-time">' + fmtDateTime(r.startAt) + ' → ' + (r.actualEndAt ? fmtDateTime(r.actualEndAt) : '进行中…') + '｜' + targetLine + '</div>' +
    (r.recordDateTime ? '<div class="rec-time">记录于 ' + esc(r.recordDateTime) + '</div>' : '') +
    entriesHTML +
    '<div class="rec-actions">' +
      '<button data-action="edit-record" data-id="' + r.id + '">✏️ 编辑记录（含子记录）</button>' +
      '<button class="del" data-action="delete-record" data-id="' + r.id + '">🗑 删除</button>' +
    '</div>' +
  '</div>';
}

function entryViewHTML(e){
  const metrics = [];
  if(e.acetone != null && e.acetone !== '') metrics.push('丙酮 <b>' + esc(e.acetone) + '</b> ppm');
  if(e.glucose != null && e.glucose !== '') metrics.push('血糖 <b>' + esc(e.glucose) + '</b> mmol/L');
  if(e.exercise) metrics.push('运动 <b>' + esc(e.exercise) + '</b>');
  const imgs = (e.images || []).map(im =>
    '<img src="' + im.dataUrl + '" alt="' + esc(im.category) + '" data-action="view-image" data-src="' + im.dataUrl + '" title="' + esc(im.category) + '">'
  ).join('');
  return '<div class="entry">' +
    '<div class="entry-head"><span class="tag">' + (e.dateTime || fmtDateTime(e.timestamp)) + '</span></div>' +
    (metrics.length ? '<div class="entry-metrics">' + metrics.map(m => '<span>' + m + '</span>').join('') + '</div>' : '') +
    (e.feeling ? '<div class="entry-text">💭 ' + esc(e.feeling) + '</div>' : '') +
    (e.note ? '<div class="entry-text muted">📝 ' + esc(e.note) + '</div>' : '') +
    (imgs ? '<div class="entry-imgs">' + imgs + '</div>' : '') +
  '</div>';
}

function renderStats(){
  const pane = $('#tab-stats');
  if(!pane) return;
  const user = currentUser();
  if(!user){ pane.innerHTML = '<div class="card empty">请先选择或建立使用者。</div>'; return; }

  const recs = user.records.slice().sort((a,b) => a.startAt - b.startAt);
  const done = recs.filter(r => r.actualEndAt);
  const totalMs = done.reduce((a,r) => a + (r.actualEndAt - r.startAt), 0);
  const avg = done.length ? totalMs/done.length : 0;
  const longest = done.reduce((a,r) => Math.max(a, r.actualEndAt - r.startAt), 0);
  const achieved = done.filter(r => {
    const orig = (r.originalTargetEndAt != null) ? r.originalTargetEndAt : r.targetEndAt;
    return (r.actualEndAt - r.startAt) >= (orig - r.startAt);
  }).length;
  const rate = done.length ? Math.round(achieved/done.length*100) : 0;
  const extendedCount = done.filter(r => recordWasExtended(r)).length;
  const allEntries = collectMeasurements(user);

  const stat = (l,v) => '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>';

  pane.innerHTML = '<div class="stat-grid">' +
    stat('总断食次数', recs.length) +
    stat('已完成', done.length) +
    stat('总断食时数', (totalMs/3600000).toFixed(1) + ' h') +
    stat('平均时长', fmtDurShort(avg)) +
    stat('最长一次', fmtDurShort(longest)) +
    stat('达标率', rate + '%') +
    stat('已延长次数', extendedCount) +
    stat('测量子记录总数', allEntries.length) +
  '</div>' +
  '<div class="card"><h3>断食时长趋势（最近 20 次，实际 vs 原始目标）</h3><canvas id="chartTrend" class="chart"></canvas></div>' +
  '<div class="card"><h3>每周断食次数（最近 12 周）</h3><canvas id="chartWeek" class="chart"></canvas></div>' +
  '<div class="card"><h3>丙酮趋势（ppm，所有测量）</h3><canvas id="chartAcetone" class="chart"></canvas></div>' +
  '<div class="card"><h3>血糖趋势（mmol/L，所有测量）</h3><canvas id="chartGlucose" class="chart"></canvas></div>' +
  '<div class="card"><h3>方案分布</h3><canvas id="chartPlan" class="chart"></canvas></div>';

  const recent = done.slice(-20);
  if(recent.length){
    const actual = recent.map(r => +((r.actualEndAt - r.startAt)/3600000).toFixed(2));
    const origTarget = recent.map(r => +(recordOriginalTargetMs(r)/3600000).toFixed(2));
    const curTarget = recent.map(r => recordWasExtended(r) ? +(recordCurrentTargetMs(r)/3600000).toFixed(2) : null);
    const hasExtended = curTarget.some(v => v != null);
    const series = [
      { name:'实际 (h)', color:'#0d9488', data: actual },
      { name:'原始目标 (h)', color:'#94a3b8', data: origTarget }
    ];
    if(hasExtended) series.push({ name:'延长后目标 (h)', color:'#f59e0b', data: curTarget });
    drawLineChart($('#chartTrend'), recent.map(r => fmtMD(r.startAt)), series);
  } else drawEmpty($('#chartTrend'));

  const curWeek = weekStart(Date.now());
  const weekLabels = [], weekVals = [];
  for(let i = 11; i >= 0; i--){
    const ws = curWeek - i*7*86400000;
    weekLabels.push(fmtMD(ws));
  }
  for(let i = 11; i >= 0; i--){
    const ws = curWeek - i*7*86400000;
    const we = ws + 7*86400000;
    weekVals.push(recs.filter(r => r.startAt >= ws && r.startAt < we).length);
  }
  drawBarChart($('#chartWeek'), weekLabels, weekVals, '#6366f1');

  const acetonePts = allEntries.filter(x => x.entry.acetone != null && x.entry.acetone !== '' && !isNaN(parseFloat(x.entry.acetone)));
  if(acetonePts.length){
    drawLineChart($('#chartAcetone'), acetonePts.map(x => fmtMD(x.ts)),
      [{ name:'丙酮 ppm', color:'#f59e0b', data: acetonePts.map(x => parseFloat(x.entry.acetone)) }]);
  } else drawEmpty($('#chartAcetone'));

  const gluPts = allEntries.filter(x => x.entry.glucose != null && x.entry.glucose !== '' && !isNaN(parseFloat(x.entry.glucose)));
  if(gluPts.length){
    drawLineChart($('#chartGlucose'), gluPts.map(x => fmtMD(x.ts)),
      [{ name:'血糖 mmol/L', color:'#ef4444', data: gluPts.map(x => parseFloat(x.entry.glucose)) }]);
  } else drawEmpty($('#chartGlucose'));

  const planCount = {};
  recs.forEach(r => { planCount[r.plan] = (planCount[r.plan] || 0) + 1; });
  const planKeys = Object.keys(planCount);
  if(planKeys.length) drawBarChart($('#chartPlan'), planKeys, planKeys.map(k => planCount[k]), '#0ea5e9');
  else drawEmpty($('#chartPlan'));
}

function setupCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 600, h = rect.height || 220;
  canvas.width = Math.round(w*dpr);
  canvas.height = Math.round(h*dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return { ctx, w, h };
}
function drawEmpty(canvas){
  if(!canvas) return;
  const c = setupCanvas(canvas);
  c.ctx.fillStyle = '#94a3b8';
  c.ctx.font = '13px system-ui';
  c.ctx.textAlign = 'center';
  c.ctx.fillText('暂无数据', c.w/2, c.h/2);
  c.ctx.textAlign = 'start';
}
function drawAxes(ctx, pad, cw, ch, maxY, steps){
  steps = steps || 4;
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#94a3b8';
  for(let i = 0; i <= steps; i++){
    const y = pad.t + ch - (i/steps)*ch;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l+cw, y); ctx.stroke();
    ctx.fillText(String(Math.round((maxY*i/steps)*10)/10), 4, y+4);
  }
}
function drawLineChart(canvas, labels, series){
  if(!canvas) return;
  const c = setupCanvas(canvas);
  const pad = { l:44, r:16, t:26, b:34 };
  const cw = c.w - pad.l - pad.r, ch = c.h - pad.t - pad.b;
  let maxY = 0;
  series.forEach(s => s.data.forEach(v => { if(v != null && v > maxY) maxY = v; }));
  if(maxY <= 0) maxY = 1;
  maxY *= 1.15;
  const n = labels.length;
  const xAt = i => n <= 1 ? pad.l + cw/2 : pad.l + i*(cw/(n-1));
  const yAt = v => pad.t + ch - (v/maxY)*ch;
  drawAxes(c.ctx, pad, cw, ch, maxY);
  c.ctx.fillStyle = '#94a3b8';
  c.ctx.font = '10px system-ui';
  const step = Math.max(1, Math.ceil(n/7));
  labels.forEach((lb, i) => { if(i % step === 0 || i === n-1) c.ctx.fillText(lb, xAt(i)-13, c.h-12); });
  series.forEach(s => {
    c.ctx.strokeStyle = s.color; c.ctx.lineWidth = 2;
    c.ctx.beginPath();
    let started = false;
    s.data.forEach((v, i) => {
      if(v == null) return;
      const x = xAt(i), y = yAt(v);
      if(!started){ c.ctx.moveTo(x,y); started = true; } else c.ctx.lineTo(x,y);
    });
    c.ctx.stroke();
    s.data.forEach((v, i) => {
      if(v == null) return;
      c.ctx.beginPath();
      c.ctx.arc(xAt(i), yAt(v), 3, 0, Math.PI*2);
      c.ctx.fillStyle = s.color; c.ctx.fill();
    });
  });
  let lx = pad.l;
  c.ctx.font = '11px system-ui';
  series.forEach(s => {
    c.ctx.fillStyle = s.color; c.ctx.fillRect(lx, 6, 10, 10);
    c.ctx.fillStyle = '#64748b'; c.ctx.fillText(s.name, lx+14, 15);
    lx += c.ctx.measureText(s.name).width + 32;
  });
}
function drawBarChart(canvas, labels, values, color){
  color = color || '#0d9488';
  if(!canvas) return;
  const c = setupCanvas(canvas);
  const pad = { l:44, r:16, t:26, b:34 };
  const cw = c.w - pad.l - pad.r, ch = c.h - pad.t - pad.b;
  const maxY = Math.max(1, ...values) * 1.25;
  drawAxes(c.ctx, pad, cw, ch, maxY);
  const n = labels.length;
  const slot = cw / n;
  const bw = Math.min(46, slot*0.6);
  values.forEach((v, i) => {
    const x = pad.l + slot*i + (slot-bw)/2;
    const bh = (v/maxY)*ch;
    const y = pad.t + ch - bh;
    c.ctx.fillStyle = color;
    c.ctx.beginPath();
    if(c.ctx.roundRect){ c.ctx.roundRect(x, y, bw, Math.max(bh,1), 5); c.ctx.fill(); }
    else c.ctx.fillRect(x, y, bw, Math.max(bh,1));
    c.ctx.fillStyle = '#64748b'; c.ctx.font = '11px system-ui'; c.ctx.textAlign = 'center';
    if(v > 0) c.ctx.fillText(String(v), x + bw/2, y - 4);
    c.ctx.fillStyle = '#94a3b8'; c.ctx.font = '10px system-ui';
    c.ctx.fillText(labels[i], x + bw/2, c.h - 12);
    c.ctx.textAlign = 'start';
  });
}

function switchUser(){

  if(!nickInput) return;
  const nick = nickInput.value.trim();

  if(!state.data.users[nick]){
    state.data.users[nick] = { nickname:nick, createdAt:Date.now(), records: [] };
  }
  state.data.currentUser = nick;
  state.selectedDate = null;
  const paneR = $('#tab-records');
  if(paneR) paneR.dataset.built = '';
  saveData();
  renderAll();
  nickInput.value = '';
}

function startFast(){
  const user = currentUser();
  if(!user) return;
  if(user.records.some(r => !r.actualEndAt)){
    alert('你已经有一个进行中的断食，请先结束它。');
    return;
  }
  const sd = $('#tfStartDate'), st = $('#tfStartTime'), h = $('#tfHours');
  const startMs = combineDateTime(sd ? sd.value : null, st ? st.value : null);
  const hours = h ? parseFloat(h.value) : NaN;
  if(startMs == null){ alert('请填写开始日期与时间'); return; }
  if(!hours || hours <= 0){ alert('请填写正确的断食小时数'); return; }

  const planKey = (PLANS.find(p => p.hours === hours) || {}).key || 'custom';
  const now = Date.now();
  const targetEndAt = startMs + hours*3600000;
  const rec = {
    id: uid(), plan: planKey,
    targetHours: hours,
    originalTargetHours: hours,
    originalTargetEndAt: targetEndAt,
    startAt: startMs,
    targetEndAt: targetEndAt,
    actualEndAt: null,
    recordDate: fmtDate(now),
    recordDateTime: fmtDateTime(now),
    entries: [],
    createdAt: now, updatedAt: now
  };
  user.records.push(rec);
  saveData();
  renderAll();
}

function endFast(){
  const user = currentUser();
  if(!user) return;
  const r = user.records.find(x => !x.actualEndAt);
  if(!r) return;
  const elapsed = Date.now() - r.startAt;
  const orig = (r.originalTargetEndAt != null) ? r.originalTargetEndAt : r.targetEndAt;
  const origTarget = orig - r.startAt;
  const curTarget = r.targetEndAt - r.startAt;
  const targetLine = recordWasExtended(r)
    ? '原始目标 ' + fmtDuration(origTarget) + '，已延长至 ' + fmtDuration(curTarget)
    : '目标 ' + fmtDuration(origTarget);
  const msg = elapsed >= origTarget
    ? '已达成目标！\n实际断食：' + fmtDuration(elapsed) + '\n' + targetLine + '\n确定结束这次断食吗？'
    : '目前进行 ' + fmtDuration(elapsed) + '，尚未达到目标 ' + fmtDuration(origTarget) + '。\n' + targetLine + '\n确定要「提前结束」吗？';
  if(!confirm(msg)) return;
  r.actualEndAt = Date.now();
  r.updatedAt = Date.now();
  saveData();
  renderAll();
}

function extendFast(hours){
  const user = currentUser();
  const r = user && user.records.find(x => !x.actualEndAt);
  if(!r) return;
  if(r.originalTargetEndAt == null) r.originalTargetEndAt = r.startAt + (r.targetHours || 0)*3600000;
  if(r.originalTargetHours == null) r.originalTargetHours = (r.originalTargetEndAt - r.startAt) / 3600000;
  r.targetEndAt += hours * 3600000;
  r.targetHours = (r.targetEndAt - r.startAt) / 3600000;
  r.updatedAt = Date.now();
  saveData();
  renderAll();
}

function extendCustom(){
  const v = prompt('请输入要延长的小时数（可为小数，例如 1.5）');
  if(v == null) return;
  const h = parseFloat(v);
  if(!h || h <= 0){ alert('请输入正确的数字'); return; }
  extendFast(h);
}

function openRecordModal(id){

function normalizeEntry(e){
  if(!e.id) e.id = uid();
  if(!e.timestamp){ e.timestamp = Date.now(); e.dateTime = fmtDateTime(e.timestamp); }
  if(!e.dateTime) e.dateTime = fmtDateTime(e.timestamp);
  if(!Array.isArray(e.images)) e.images = [];
  if(e.acetone === undefined) e.acetone = null;
  if(e.glucose === undefined) e.glucose = null;
  if(e.exercise === undefined) e.exercise = '';
  if(e.feeling === undefined) e.feeling = '';
  if(e.note === undefined) e.note = '';
  return e;
}

function newEntry(ts){
  ts = ts || Date.now();
  return normalizeEntry({
    id: uid(), timestamp: ts, dateTime: fmtDateTime(ts),
    acetone: null, glucose: null,
    exercise: '', feeling: '', note: '', images: []
  });
}

function bindEntryEditorEvents(){
  $$('[data-entry-date]').forEach(el => { el.addEventListener('input', () => syncEntryDate(el.dataset.entryDate)); });
  $$('[data-entry-time]').forEach(el => { el.addEventListener('input', () => syncEntryDate(el.dataset.entryTime)); });
  $$('[data-entry-acetone]').forEach(el => {
    el.addEventListener('input', () => {
      const e = findEntry(el.dataset.entryAcetone);
      if(e) e.acetone = el.value.trim() === '' ? null : parseFloat(el.value);
    });
  });
  $$('[data-entry-glucose]').forEach(el => {
    el.addEventListener('input', () => {
      const e = findEntry(el.dataset.entryGlucose);
      if(e) e.glucose = el.value.trim() === '' ? null : parseFloat(el.value);
    });
  });
  $$('[data-entry-exercise]').forEach(el => {
    el.addEventListener('input', () => { const e = findEntry(el.dataset.entryExercise); if(e) e.exercise = el.value; });
  });
  $$('[data-entry-feeling]').forEach(el => {
    el.addEventListener('input', () => { const e = findEntry(el.dataset.entryFeeling); if(e) e.feeling = el.value; });
  });
  $$('[data-entry-note]').forEach(el => {
    el.addEventListener('input', () => { const e = findEntry(el.dataset.entryNote); if(e) e.note = el.value; });
  });
  $$('[data-entry-images]').forEach(el => {
    el.addEventListener('change', async ev => {
      const e = findEntry(el.dataset.entryImages);
      if(!e) return;
      const files = Array.from(ev.target.files || []);
      if(!files.length) return;
      for(const f of files){
        try{
          const dataUrl = await compressImage(f, 1000, 0.7);
          e.images.push({ id: uid(), name: f.name, category:'其他', dataUrl: dataUrl, addedAt: Date.now() });
        }catch(err){ console.warn('图片处理失败', err); }
      }
      ev.target.value = '';
      renderEntryEditors();
    });
  });
  $$('[data-entry-imgcat]').forEach(sel => {
    sel.addEventListener('change', () => {
      const parts = sel.dataset.entryImgcat.split('|');
      const e = findEntry(parts[0]);
      if(!e) return;
      const im = e.images.find(x => x.id === parts[1]);
      if(im) im.category = sel.value;
    });
  });
}

function saveRecord(){
  const user = currentUser();
  if(!user) return;
  const recDate = $('#fRecDate') ? $('#fRecDate').value : '';
  const recTime = $('#fRecTime') ? $('#fRecTime').value : '';
  const recDateTimeTs = combineDateTime(recDate, recTime);
  if(recDateTimeTs == null){ alert('请填写记录日期与时间'); return; }
  const startAt = combineDateTime($('#fStartDate') ? $('#fStartDate').value : '', $('#fStartTime') ? $('#fStartTime').value : '');
  if(startAt == null){ alert('请填写开始日期与时间'); return; }
  const endDate = $('#fEndDate') ? $('#fEndDate').value : '';
  const endTime = $('#fEndTime') ? $('#fEndTime').value : '';
  const actualEndAt = (endDate && endTime) ? combineDateTime(endDate, endTime) : null;
  if(actualEndAt != null && actualEndAt < startAt){ alert('结束时间不能早于开始时间'); return; }
  const hours = parseFloat($('#fHours').value);
  if(!hours || hours <= 0){ alert('请填写正确的断食小时数'); return; }

  state.formEntries.forEach(e => {
    const dEl = document.querySelector('[data-entry-date="' + e.id + '"]');
    const tEl = document.querySelector('[data-entry-time="' + e.id + '"]');
    if(dEl && tEl){
      const ts = combineDateTime(dEl.value, tEl.value);
      if(ts != null){ e.timestamp = ts; e.dateTime = fmtDateTime(ts); }
    }
    normalizeEntry(e);
  });

  let originalHours = hours;
  if(state.editingId){
    const existing = user.records.find(x => x.id === state.editingId);
    if(existing && existing.originalTargetHours != null) originalHours = existing.originalTargetHours;
  }

  const data = {
    plan: (PLANS.find(p => p.hours === hours) || {}).key || 'custom',
    targetHours: hours,
    originalTargetHours: originalHours,
    originalTargetEndAt: startAt + originalHours*3600000,
    startAt: startAt,
    targetEndAt: startAt + hours*3600000,
    actualEndAt: actualEndAt,
    recordDate: fmtDate(recDateTimeTs),
    recordDateTime: fmtDateTime(recDateTimeTs),
    entries: state.formEntries.slice(),
    updatedAt: Date.now()
  };

  if(state.editingId){
    const r = user.records.find(x => x.id === state.editingId);
    if(r){
      if(r.originalTargetEndAt != null && r.originalTargetHours != null){
        data.originalTargetHours = r.originalTargetHours;
        data.originalTargetEndAt = r.originalTargetEndAt;
      }
      Object.assign(r, data);
    }
  }else{
    user.records.push(Object.assign({ id: uid(), createdAt: Date.now() }, data));
  }
  saveData();
  closeModal();
  renderAll();
}

function deleteRecord(id){

  user.records = user.records.filter(x => x.id !== id);
  saveData();
  renderAll();
}

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1000; quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

}

function exportJSON(){
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = 'fasting-data-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function handleImport(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const obj = JSON.parse(reader.result);
      if(!obj || typeof obj !== 'object' || typeof obj.users !== 'object'){ alert('JSON 格式不正确：缺少 users 字段。'); return; }
      const mode = confirm('按「确定」= 合并导入（保留现有数据）\n按「取消」= 覆盖全部数据');
      if(mode){
        for(const nick of Object.keys(obj.users)){
          const u = obj.users[nick];
          if(!state.data.users[nick]){ state.data.users[nick] = u; }
          else{
            const existing = new Set(state.data.users[nick].records.map(r => r.id));
            (u.records || []).forEach(r => { if(!existing.has(r.id)) state.data.users[nick].records.push(r); });
          }
        }
      }else{
        state.data = obj;
        if(!state.data.users) state.data.users = {};
      }
      migrateData();
      const paneR = $('#tab-records');
      if(paneR) paneR.dataset.built = '';
      saveData();
      renderAll();
      alert('✅ 导入完成！');
    }catch(err){ alert('导入失败：' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function clearUser(){
  const user = currentUser();
  if(!user){ alert('目前没有选择使用者'); return; }
  if(!confirm('确定清除使用者「' + user.nickname + '」的所有记录吗？')) return;
  delete state.data.users[user.nickname];
  state.data.currentUser = Object.keys(state.data.users)[0] || null;
  const paneR = $('#tab-records');
  if(paneR) paneR.dataset.built = '';
  saveData();
  renderAll();
}

function clearAll(){
  if(!confirm('⚠ 确定清除「全部」使用者与记录吗？此操作无法复原！')) return;
  if(!confirm('再次确认：所有数据都会被删除。')) return;
  state.data = defaultData();
  const paneR = $('#tab-records');
  if(paneR) paneR.dataset.built = '';
  saveData();
  renderAll();
}

/* =========================================================
   统一渲染
   ========================================================= */
function renderAll(){
  safeRender(renderUserBar, 'userBar');
  safeRender(updateDbIndicator, 'dbIndicator');
  switch(state.tab){
    case 'timer':    safeRender(renderTimer, 'timer'); break;
    case 'records':  safeRender(renderRecords, 'records'); break;
    case 'calendar': safeRender(renderCalendar, 'calendar'); break;
    case 'stats':    safeRender(renderStats, 'stats'); break;
    case 'data':     safeRender(renderData, 'data'); break;
  }
}

/* =========================================================
   事件处理（全部委托到 document，最容易出问题的地方都用 try/catch）
   ========================================================= */
function handleAction(action, el, e){
  try {
    switch(action){
      case 'switch-user':           switchUser(); return;
      case 'open-db-tab': {
        state.tab = 'data';
        $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === 'data'));
        $$('.pane').forEach(p => p.hidden = p.id !== 'tab-data');
        renderAll();
        return;
      }
      case 'pick-timer-plan': {
        state.timerFormPlan = el.dataset.plan;
        $$('#tab-timer .chip').forEach(c => c.classList.toggle('active', c.dataset.plan === state.timerFormPlan));
        const h = $('#tfHours');
        if(h && state.timerFormPlan !== 'custom' && PLAN_MAP[state.timerFormPlan]) h.value = PLAN_MAP[state.timerFormPlan].hours;
        updateTargetPreview();
        return;
      }
      case 'start-fast':            startFast(); return;
      case 'end-fast':              endFast(); return;
      case 'extend-fast':           extendFast(Number(el.dataset.hours)); return;
      case 'extend-custom':         extendCustom(); return;
      case 'new-record':            openRecordModal(null); return;
      case 'edit-record':           openRecordModal(el.dataset.id); return;
      case 'delete-record':         deleteRecord(el.dataset.id); return;
      case 'delete-current':        if(state.editingId) deleteRecord(state.editingId); return;
      case 'close-modal':           closeModal(); return;
      case 'save-record':           saveRecord(); return;
      case 'pick-form-plan': {
        state.formPlan = el.dataset.plan;
        $$('#modalBody .chip').forEach(c => c.classList.toggle('active', c.dataset.plan === state.formPlan));
        const h = $('#fHours');
        if(h && state.formPlan !== 'custom' && PLAN_MAP[state.formPlan]) h.value = PLAN_MAP[state.formPlan].hours;
        const ev = new Event('input');
        if(h) h.dispatchEvent(ev);
        return;
      }
      case 'add-entry':             addEntry(); return;
      case 'remove-entry':          removeEntry(el.dataset.eid); return;
      case 'remove-entry-image':    removeEntryImage(el.dataset.eid, el.dataset.iid); return;
      case 'view-image':            openLightbox(el.dataset.src); return;
      case 'cal-prev': {
        const d = new Date(state.calMonth); d.setMonth(d.getMonth() - 1);
        state.calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
        renderCalendar(); return;
      }
      case 'cal-next': {
        const d = new Date(state.calMonth); d.setMonth(d.getMonth() + 1);
        state.calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
        renderCalendar(); return;
      }
      case 'cal-today': {
        const n = new Date();
        state.calMonth = new Date(n.getFullYear(), n.getMonth(), 1);
        state.selectedDate = fmtDate(Date.now());
        renderCalendar(); return;
      }
      case 'pick-day':              state.selectedDate = el.dataset.key; renderCalendar(); return;
      case 'link-db':               chooseDatabaseFolder(); return;
      case 'restore-permission':    restorePermission(); return;
      case 'forget-handle':         forgetHandle(); return;
      case 'reload-db':             reloadFromDisk(); return;
      case 'unlink-db':             unlinkDatabase(); return;
      case 'force-write':           writeDatabase().then(() => renderAll()); return;
      case 'retry-write':           retryWrite(); return;
      case 'export-json':           exportJSON(); return;
      case 'clear-user':            clearUser(); return;
      case 'clear-all':             clearAll(); return;
      default:
        console.warn('未知 action:', action);
    }
  } catch(err){
    console.error('handleAction 出错', err);
    alert('操作失败：' + (err && err.message ? err.message : err));
  }
}

/* =========================================================
   启动（关键修复：先绑定所有事件，再渲染，异步恢复放到最后）
   ========================================================= */
function boot(){
  // 1) 全局点击委托
  document.addEventListener('click', e => {
    try {
      const el = e.target.closest('[data-action]');
      if(!el) return;
      handleAction(el.dataset.action, el, e);
    } catch(err){ console.error('click 委托出错', err); }
  });

  // 2) Tab 切换
  $$('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      try {
        state.tab = btn.dataset.tab;
        $$('.tab').forEach(b => b.classList.toggle('active', b === btn));
        $$('.pane').forEach(p => p.hidden = p.id !== 'tab-' + state.tab);
        renderAll();
      } catch(err){ console.error('tab 切换出错', err); }
    });
  });

  // 3) 使用者下拉
  document.addEventListener('change', e => {
    try {
      if(e.target && e.target.id === 'userSelect'){
        const v = e.target.value;
        if(v && state.data.users[v]){
          state.data.currentUser = v;
          state.selectedDate = null;
          const paneR = $('#tab-records');
          if(paneR) paneR.dataset.built = '';
          saveData();
          renderAll();
        }
      }
    } catch(err){ console.error('change 委托出错', err); }
  });

  // 4) 键盘
  document.addEventListener('keydown', e => {
    try {
      if(e.key === 'Enter' && e.target && e.target.id === 'nickInput') switchUser();
      const mr = $('#modalRoot');
      if(e.key === 'Escape' && mr && !mr.hidden) closeModal();
    } catch(err){ console.error('keydown 委托出错', err); }
  });

  // 5) 点击 modal 背景关闭
  const mr = $('#modalRoot');
  if(mr){
    mr.addEventListener('click', e => { if(e.target === mr) closeModal(); });
  }

  // 6) 页面卸载前尽量写盘
  window.addEventListener('beforeunload', () => {
    if(db.fileHandle && db.dirty && !db.needsPermission) writeDatabase({ silent:true });
  });

  // 7) 首次渲染
  const names = Object.keys(state.data.users);
  if(!state.data.currentUser && names.length) state.data.currentUser = names[0];
  renderAll();

  // 8) 每秒刷新计时器
  setInterval(() => {
    try {
      if(state.tab === 'timer'){
        const pane = $('#tab-timer');
        if(pane && !pane.hidden) updateTimerLive();
      }
    } catch(err){ /* 忽略 */ }
  }, 1000);

  // 9) 窗口大小变化重绘图表
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if(state.tab !== 'stats') return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { try{ renderStats(); }catch(_){} }, 200);
  });

  // 10) 异步恢复 handle（绝不阻塞 UI）
  setTimeout(() => {
    restoreHandleOnStartup().catch(err => console.warn('恢复 handle 失败', err));
  }, 100);

  // 11) 自动聚焦 nickname
  if(!state.data.currentUser){
    setTimeout(() => { const ni = $('#nickInput'); if(ni) ni.focus(); }, 300);
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
}else{
  boot();
}
</script>
